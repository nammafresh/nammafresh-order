<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NammaFresh Egg Order</title>
<style>
:root{color-scheme:light dark;--brand:#01514E;--cream:#F5EFE2;--bg:light-dark(#FAF8F3,#10201f);--card:light-dark(#fff,#18302e);--text:light-dark(#16312f,#f2f8f7);--muted:light-dark(#647875,#b7c9c7);--line:light-dark(#d9e5e2,#34504d);--gold:#D4AF37}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
#app{min-height:100vh;background-color:var(--bg)}.wrap{max-width:560px;margin:auto;padding:28px 18px 40px}.brand{text-align:center}.logo{width:72px;height:72px;border-radius:22px;background:var(--brand);display:inline-flex;align-items:center;justify-content:center;color:white;font-size:35px;box-shadow:0 8px 24px #0002}.brand h1{margin:12px 0 4px;font-size:28px;color:var(--brand)}.brand p{margin:0 0 22px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 30px #00000010}.section{margin-bottom:20px}.label{font-weight:700;margin-bottom:10px;display:block}.choices{display:grid;gap:10px}.choice{border:2px solid var(--line);border-radius:15px;padding:14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}.choice.selected{border-color:var(--brand);background:light-dark(#e8f3f1,#173e3a)}.choice strong{display:block;font-size:17px}.choice small{color:var(--muted)}.price{font-weight:800;color:var(--brand)}
.qty{display:flex;align-items:center;justify-content:center;gap:22px}.qty button{width:46px;height:46px;border:0;border-radius:50%;font-size:25px;background:var(--brand);color:white;cursor:pointer}.qty span{font-size:22px;font-weight:800;min-width:90px;text-align:center}.input{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;background:transparent;color:var(--text);font-size:16px}.summary{background:light-dark(#f5efe2,#253b39);border-radius:15px;padding:15px;margin-bottom:16px}.summary div{display:flex;justify-content:space-between;margin:7px 0}.total{font-size:20px;font-weight:800;border-top:1px solid var(--line);padding-top:10px}.wa{width:100%;border:0;border-radius:15px;padding:16px;background:#25D366;color:#063b1e;font-weight:800;font-size:17px;cursor:pointer}.note{text-align:center;color:var(--muted);font-size:12px;margin-top:12px;line-height:1.5}.error{color:#b33;font-size:13px;margin-top:7px;display:none}
</style>
</head>
<body><main id="app"><div class="wrap">
<div class="brand"><div class="logo">🥚</div><h1>NammaFresh</h1><p>Fresh eggs • Easy ordering</p></div>
<div class="card">
<div class="section"><span class="label">1. Choose egg type</span><div class="choices" id="choices"></div></div>
<div class="section"><span class="label">2. Quantity</span><div class="qty"><button id="minus">−</button><span id="qty">1 Tray</span><button id="plus">+</button></div><p class="note">Minimum 1 tray (30 eggs)</p></div>
<div class="section"><label class="label" for="door">3. Door No. & Block</label><input class="input" id="door" placeholder="Example: A-203" autocomplete="off"><div class="error" id="err">Please enter your door number.</div></div>
<div class="summary"><div><span>Eggs</span><strong id="sumType">Brown</strong></div><div><span>Quantity</span><strong id="sumQty">1 Tray</strong></div><div class="total"><span>Total</span><strong id="sumTotal">₹420</strong></div></div>
<button class="wa" id="send">💬 Send Order on WhatsApp</button><p class="note">WhatsApp will open with your order already filled in. Just press Send.</p>
</div></div></main>
<script>
const phone='917353030760';
const products={Brown:{price:420,desc:'30 eggs / tray'},Natti:{price:480,desc:'30 eggs / tray'},Mixed:{price:450,desc:'15 Brown + 15 Natti'}};
let type='Brown',qty=1;
const choices=document.getElementById('choices');
Object.entries(products).forEach(([name,p])=>{const el=document.createElement('div');el.className='choice';el.dataset.type=name;el.innerHTML=`<div><strong>${name}</strong><small>${p.desc}</small></div><div class="price">₹${p.price}/tray</div>`;el.onclick=()=>{type=name;render()};choices.appendChild(el)});
function render(){document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x.dataset.type===type));document.getElementById('qty').textContent=qty+(qty===1?' Tray':' Trays');document.getElementById('sumType').textContent=type;document.getElementById('sumQty').textContent=qty+(qty===1?' Tray':' Trays');document.getElementById('sumTotal').textContent='₹'+(products[type].price*qty);}
document.getElementById('minus').onclick=()=>{if(qty>1){qty--;render()}};document.getElementById('plus').onclick=()=>{if(qty<20){qty++;render()}};
document.getElementById('send').onclick=()=>{const door=document.getElementById('door').value.trim();if(!door){document.getElementById('err').style.display='block';document.getElementById('door').focus();return}document.getElementById('err').style.display='none';const total=products[type].price*qty;const msg=`🥚 NammaFresh Order\n\nEgg Type: ${type}\nQuantity: ${qty} ${qty===1?'Tray':'Trays'}\nDoor No. & Block: ${door}\nTotal: ₹${total}\n\nPlease confirm my order.`;window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank')};
render();
</script></body></html>
