<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NammaFresh Egg Order</title>

<style>
:root{
  color-scheme:light dark;
  --brand:#01514E;
  --cream:#F5EFE2;
  --bg:light-dark(#FAF8F3,#10201f);
  --card:light-dark(#fff,#18302e);
  --text:light-dark(#16312f,#f2f8f7);
  --muted:light-dark(#647875,#b7c9c7);
  --line:light-dark(#d9e5e2,#34504d);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

#app{
  min-height:100vh;
  background-color:var(--bg);
}

.wrap{
  max-width:560px;
  margin:auto;
  padding:28px 18px 40px;
}

.brand{
  text-align:center;
}

.logo{
  width:72px;
  height:72px;
  border-radius:22px;
  background:var(--brand);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:35px;
  box-shadow:0 8px 24px #0002;
}

.brand h1{
  margin:12px 0 4px;
  font-size:28px;
  color:var(--brand);
}

.brand p{
  margin:0 0 22px;
  color:var(--muted);
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px;
  box-shadow:0 8px 30px #00000010;
}

.section{
  margin-bottom:20px;
}

.label{
  font-weight:700;
  margin-bottom:10px;
  display:block;
}

.choices{
  display:grid;
  gap:10px;
}

.choice{
  border:2px solid var(--line);
  border-radius:15px;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.choice strong{
  display:block;
  font-size:17px;
}

.choice small{
  color:var(--muted);
}

.choice-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}

.choice-actions button{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:var(--brand);
  color:#fff;
  font-size:22px;
  cursor:pointer;
}

.choice-actions span{
  width:55px;
  text-align:center;
  font-weight:800;
}

.input{
  width:100%;
  padding:14px;
  border:1px solid var(--line);
  border-radius:13px;
  background:transparent;
  color:var(--text);
  font-size:16px;
}

.summary{
  background:light-dark(#f5efe2,#253b39);
  border-radius:15px;
  padding:15px;
  margin-bottom:16px;
}

.summary div{
  display:flex;
  justify-content:space-between;
  margin:7px 0;
  gap:10px;
}

.total{
  font-size:20px;
  font-weight:800;
  border-top:1px solid var(--line);
  padding-top:10px;
}

.wa{
  width:100%;
  border:0;
  border-radius:15px;
  padding:16px;
  background:#25D366;
  color:#063b1e;
  font-weight:800;
  font-size:17px;
  cursor:pointer;
}

.note{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:12px;
  line-height:1.5;
}

.error{
  color:#b33;
  font-size:13px;
  margin-top:7px;
  display:none;
}
</style>
</head>

<body>

<main id="app">
<div class="wrap">

<div class="brand">
  <div class="logo">🥚</div>
  <h1>NammaFresh</h1>
  <p>Fresh eggs • Easy ordering</p>
</div>

<div class="card">

<div class="section">
  <span class="label">1. Choose your eggs</span>

  <div class="choices" id="choices"></div>

  <p class="note">
    Add any combination. Example: 1 Brown + 2 Mixed.
  </p>
</div>

<div class="section">

  <label class="label" for="door">
    2. Door No. & Block
  </label>

  <input
    class="input"
    id="door"
    placeholder="Example: A-203"
    autocomplete="off"
  >

  <div class="error" id="err">
    Please enter your door number.
  </div>

</div>

<div class="summary">

  <div>
    <span>Order</span>
    <strong id="sumType">No items</strong>
  </div>

  <div>
    <span>Total trays</span>
    <strong id="sumQty">0</strong>
  </div>

  <div class="total">
    <span>Total</span>
    <strong id="sumTotal">₹0</strong>
  </div>

</div>

<button class="wa" id="send">
  💬 Send Order on WhatsApp
</button>

<p class="note">
  WhatsApp will open with your order already filled in.
  Just press Send.
</p>

</div>
</div>
</main>

<script>

const phone = '917353030760';

const products = {

  Brown: {
    price: 420,
    desc: '30 eggs / tray'
  },

  Natti: {
    price: 480,
    desc: '30 eggs / tray'
  },

  Mixed: {
    price: 450,
    desc: '15 Brown + 15 Natti'
  }

};

const cart = {
  Brown: 0,
  Natti: 0,
  Mixed: 0
};

const choices = document.getElementById('choices');


/* Create Brown / Natti / Mixed rows */

Object.entries(products).forEach(([name, product]) => {

  const el = document.createElement('div');

  el.className = 'choice';

  el.innerHTML = `

    <div>
      <strong>${name}</strong>

      <small>
        ${product.desc} • ₹${product.price}/tray
      </small>
    </div>

    <div class="choice-actions">

      <button
        type="button"
        data-action="minus">
        −
      </button>

      <span id="count-${name}">
        0 Tray
      </span>

      <button
        type="button"
        data-action="plus">
        +
      </button>

    </div>

  `;


  /* Minus button */

  el.querySelector('[data-action="minus"]').onclick = () => {

    if (cart[name] > 0) {

      cart[name]--;

      render();

    }

  };


  /* Plus button */

  el.querySelector('[data-action="plus"]').onclick = () => {

    if (cart[name] < 20) {

      cart[name]++;

      render();

    }

  };


  choices.appendChild(el);

});


/* Update screen */

function render() {

  let totalTrays = 0;

  let total = 0;

  let items = [];


  Object.entries(products).forEach(([name, product]) => {

    const quantity = cart[name];


    document.getElementById(
      'count-' + name
    ).textContent =
      quantity +
      (quantity === 1 ? ' Tray' : ' Trays');


    if (quantity > 0) {

      totalTrays += quantity;

      total += product.price * quantity;

      items.push(
        name +
        ' – ' +
        quantity +
        (quantity === 1 ? ' Tray' : ' Trays')
      );

    }

  });


  document.getElementById('sumType').textContent =
    items.length
      ? items.join(', ')
      : 'No items';


  document.getElementById('sumQty').textContent =
    totalTrays;


  document.getElementById('sumTotal').textContent =
    '₹' + total;

}


/* Send order to WhatsApp */

document.getElementById('send').onclick = () => {

  const door =
    document.getElementById('door').value.trim();


  const items =
    Object.entries(products)

      .filter(([name]) => cart[name] > 0)

      .map(([name, product]) => {

        const quantity = cart[name];

        return (
          name +
          ' – ' +
          quantity +
          (quantity === 1 ? ' Tray' : ' Trays')
        );

      });


  const total =
    Object.entries(products).reduce(
      (sum, [name, product]) => {

        return sum +
          product.price *
          cart[name];

      },
      0
    );


  /* No egg selected */

  if (!items.length) {

    alert(
      'Please select at least one egg type.'
    );

    return;

  }


  /* Door number required */

  if (!door) {

    document.getElementById(
      'err'
    ).style.display = 'block';

    document.getElementById(
      'door'
    ).focus();

    return;

  }


  document.getElementById(
    'err'
  ).style.display = 'none';


  /* WhatsApp message */

  const message =

`🥚 NammaFresh Order

${items.join('\n')}

Door No. & Block: ${door}
Total: ₹${total}

Please confirm my order.`;


  const whatsappURL =
    'https://wa.me/' +
    phone +
    '?text=' +
    encodeURIComponent(message);


  window.open(
    whatsappURL,
    '_blank'
  );

};


/* Initial display */

render();

</script>

</body>
</html>
